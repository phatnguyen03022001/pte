    - "Extract the accepted TASK-0010 local-STT infrastructure into one smallest neutral shared owner under src/lib/local-stt (or one equivalent neutral owner) only because Read Aloud is now a second consumer. Shared owner may contain: exact pinned model/revision constants, worker creation/worker message contract, the dedicated ASR worker, and browser-native audio decode/downmix/resample-to-mono-Float32-16k helpers."
    - "Both Repeat Sentence and Read Aloud must use the shared local-STT worker/audio primitives after extraction. Do not extract React feature state machines, timers, scoring/result components, route loaders or prompt-specific behavior. WFD remains outside local-STT sharing."
    - "Preserve exact accepted STT semantics: @huggingface/transformers 4.3.0; onnx-community/whisper-tiny.en revision 2575352d61be1bf7225cf8f8b268a4678025fc58; worker-only inference; WebGPU preferred; one WASM fallback; no HF_TOKEN; no remote inference; mono Float32 16 kHz input."
    - "Implement /practice/read-aloud as a server-first route using existing typed public Supabase client. Support ?item=<slug>; invalid/missing/inactive values deterministically fall back to the first valid active row or a clear empty state."
    - "Update /practice to expose six implemented task types, adding Read Aloud."
    - "Passage text is visibly displayed from initial render because Read Aloud is a reading prompt. Do not hide it."
    - "Implement one feature-local client component for Read Aloud interaction. It may own only preparation timer, STT readiness, recording/processing/transcript/result/error state. No global state, auth or persistence."
    - "Provide a local preparation aid reflecting current Pearson timing: a 30-second preparation countdown. Learner may start it once per item/reset; while it runs show remaining seconds. Provide an explicitly-labelled 'Skip preparation for practice' action so local practice is not forced to wait 30 seconds; explain Pearson gives 30-40 seconds."
    - "Recording becomes available only after local STT readiness and either preparation countdown completion or explicit Skip preparation. Permit exactly one recording per item/reset. Use getUserMedia({audio:true}) + MediaRecorder/native audio APIs. Hard safety cap is 60 seconds and must be labelled a local practice cap because Pearson answer time varies by item length."
    - "Provide explicit Stop reading; auto-stop at 60-second local cap. Keep learner audio ephemeral in memory only. Stop tracks and release buffers after transcription/result/reset/item change."
    - "Transcribe locally through the shared exact Whisper worker. Display non-empty transcript when successful; explicit recoverable local error on model/mic/decode/inference failure; never silently send audio elsewhere."
    - "Reuse the already accepted neutral word normalization/LCS helper for local content comparison. Display 'Practice content coverage: M / N' where N is normalized passage word count and M is LCS matched words from local transcript."
    - "Explicitly state that content coverage is a local transcript proxy and is not Pearson Content, Pronunciation, Oral Fluency, score or points; local STT errors can affect M/N. Do not estimate pronunciation, stress, intonation, pace or oral fluency."
    - "Reset cancels prep timer, stops tracks/recording, clears transcript/result/errors and restores one preparation/one recording. Item change performs equivalent cleanup. Shared worker/model may remain loaded for the page session."
    - "Add direct bidirectional Study bridge between /study/read-aloud-strategy and /practice/read-aloud. No generalized recommendation layer."
