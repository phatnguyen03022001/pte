    - "Run pnpm install --frozen-lockfile, pnpm ignored-builds, pnpm lint, pnpm typecheck, pnpm build and git diff --check. Frozen install must PASS; ignored builds remain exactly protobufjs + onnxruntime-node."
    - "Run bounded production HTTP proof: /practice exposes six task types; /practice/read-aloud default/selected/invalid paths return 200; visible passage is rendered; /study/read-aloud-strategy returns 200 and links to Practice."
    - "Run real Chrome/CDP fake-microphone proof without browser-test dependencies. Generate one ignored task-owned fake audio fixture from the exact first Read Aloud passage using local/native tooling, launch Chrome fake-media path, use the application getUserMedia/MediaRecorder flow and exact shared local Whisper worker."
