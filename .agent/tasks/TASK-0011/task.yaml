    - "After authoring, prove exactly eight active Read Aloud rows, exact slugs/titles/provenance, four starter/four developing, passage word count 35..55, <=60 words and 2..4 sentences. Prove prior Study/FIB/SWT/Essay/WFD/Repeat-Sentence counts and hashes unchanged except exact one new Study row."
