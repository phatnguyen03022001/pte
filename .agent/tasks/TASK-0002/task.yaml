  status: RESOLVED
  source: "existing docs/ owners plus new docs/STACK.md"
  rationale: "One small target-owned STACK owner is the simplest way to make framework/provider/status/credential truth reconstructible without scattering duplicated matrices across Product, Study, Architecture and README."

objective: "Create one complete target-owned V1 Stack & Credential SSOT and make .env.example a comprehensive blank credential inventory so every selected framework, library, browser capability, deployment platform and third-party provider is explicitly classified as installed, authorized-deferred, native/no-package, or excluded; every credential-bearing integration has exact canonical env names, public/server/operator classification and official acquisition locators; and integrations requiring no key are explicitly marked NO_KEY."

scope:
  required_changes:
    - "Fresh-resolve TASK-0002 revision 1 and the bound TASK-0001 r4 ACCEPTED review. Fresh-resolve canonical remote main. The designated local checkout may be safely FF-only synchronized from the accepted TASK-0001 review commit to the TASK-0002 handoff base when it is otherwise clean and correctly bound; preserve the ignored root .DS_Store and any ignored real env files. Do not reset/rebase/stash/clean/adopt/delete unrelated state."
    - "Create docs/STACK.md as the canonical V1 framework/third-party/credential inventory. For every item record: canonical name, role, exact current installed version when already installed, future/deferred package or external capability choice when frozen here, lifecycle status, whether a key/credential is required, canonical env name(s) when applicable, exposure class (PUBLIC_BROWSER / SERVER_SECRET / OPERATOR_ONLY / IDENTIFIER / NO_KEY), actual-value destination, exact official acquisition/documentation locator, and material notes/constraints."
    - "Inventory the currently materialized baseline exactly from package.json and pnpm-lock.yaml: Next.js 16.3.8, React 19.2.8, React DOM 19.2.8, TypeScript 5.9.3, pnpm 11.22.0, ESLint 9.x locked by the current lockfile, eslint-config-next 16.3.8, @supabase/ssr 0.12.7 and @supabase/supabase-js 2.117.2. Record Node.js requirements truthfully: Next.js requires Node >=20.9; Vercel currently supports 20.x/22.x/24.x and defaults new projects to 24.x. Do not change package.json or runtime version in this task."
    - "Freeze the V1 UI choice as official shadcn/ui for Next.js, source-owned generated components, using the official CLI only when a UI implementation task requires components. Record Tailwind CSS / component-support dependencies as implementation-time shadcn requirements rather than pre-installing unused packages. No credential is required."
    - "Freeze Study Markdown rendering to react-markdown plus remark-gfm, with raw HTML disabled by default and no rehype-raw authorization. Record both as AUTHORIZED_DEFERRED and NO_KEY. Do not install them in this task."
    - "Freeze local speaking STT to @huggingface/transformers using public onnx-community/whisper-tiny.en, WebGPU preferred with WASM fallback when needed. Record Hugging Face public model access as NO_KEY for V1; HF_TOKEN is not a V1 credential and must not be added unless a later task selects a gated/private model. Do not install/download the model in this task."
    - "Freeze reusable media storage to Cloudinary's Node/server API path only when a feature authorizes persistable media. Use one canonical server credential variable CLOUDINARY_URL, whose value encapsulates cloud name, API key and API secret per official Cloudinary SDK guidance. Classify it SERVER_SECRET. Do not add a browser Cloudinary secret, create a Cloudinary account/resource, install the SDK, upload media, or enable the feature in this task."
    - "Freeze YouTube integration as: IFrame Player/embed for playback/reference = NO_KEY; YouTube Data API v3 for bounded public metadata/search ingestion = YOUTUBE_API_KEY, SERVER_SECRET/QUOTA_CREDENTIAL, only when a feature authorizes Data API use. OAuth client ID/secret is NOT_REQUIRED for current V1 because private-user YouTube data/mutations are outside scope. Do not install a Google SDK or enable/call the API in this task."
    - "Freeze Vercel as deployment target with Git auto-deploy remaining unactivated unless separately authorized. Interactive/connected-plugin/manual authenticated deployment needs no repo runtime key. Inventory optional headless/operator automation credentials VERCEL_TOKEN (OPERATOR_ONLY secret), VERCEL_ORG_ID (IDENTIFIER) and VERCEL_PROJECT_ID (IDENTIFIER). They must never be consumed by learner runtime code."
    - "Inventory Supabase comprehensively: NEXT_PUBLIC_SUPABASE_URL (PUBLIC_BROWSER identifier) and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (PUBLIC_BROWSER key) are REQUIRED_NOW; SUPABASE_SECRET_KEY is SERVER_SECRET and AUTHORIZED_DEFERRED only for a separately authorized privileged server use; SUPABASE_PROJECT_REF is OPERATOR identifier; SUPABASE_ACCESS_TOKEN is OPERATOR_ONLY secret for scoped PAT/headless CLI/MCP only; SUPABASE_DB_PASSWORD is OPERATOR_ONLY secret only for CLI/database workflows that actually require direct database authentication. Note that normal connected Supabase MCP/plugin OAuth does not require a PAT."
    - "Make .env.example the complete blank inventory with sections for APP PUBLIC REQUIRED NOW, APP SERVER DEFERRED, and OPERATOR-ONLY / HEADLESS. Keep every value blank or a non-secret structural placeholder. It must enumerate exactly: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, CLOUDINARY_URL, YOUTUBE_API_KEY, SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. It must explicitly say which vars should normally remain blank until their feature/workflow is authorized."
    - "Do not add OPENAI_API_KEY, HF_TOKEN, Google OAuth client credentials, Redis credentials, vector/embedding provider keys, analytics keys, or other excluded/non-required credentials. Explicitly document those as NOT_REQUIRED / EXCLUDED so absence is intentional rather than an omission."
    - "Add exact official acquisition/documentation locators into docs/STACK.md and concise comments in .env.example: Supabase project API keys https://supabase.com/dashboard/project/<PROJECT_REF>/settings/api-keys ; Supabase access tokens https://supabase.com/dashboard/account/tokens ; Supabase API-key guidance https://supabase.com/docs/guides/getting-started/api-keys ; Cloudinary API Keys https://console.cloudinary.com/settings/api-keys ; Cloudinary credential guidance https://cloudinary.com/documentation/developer_onboarding_faq_find_credentials ; Google Cloud API credentials https://console.cloud.google.com/apis/credentials ; YouTube Data API overview https://developers.google.com/youtube/v3/getting-started ; YouTube IFrame API https://developers.google.com/youtube/iframe_api_reference ; Vercel access-token settings https://vercel.com/account/settings/tokens ; Vercel CLI auth/project docs https://vercel.com/docs/cli/global-options and https://vercel.com/docs/cli/project-linking ; shadcn Next.js install https://ui.shadcn.com/docs/installation/next ; Transformers.js WebGPU/Whisper https://huggingface.co/docs/transformers.js/guides/webgpu ; react-markdown source/docs https://github.com/remarkjs/react-markdown."
    - "Update README.md so docs/STACK.md is a first-class canonical truth locator. Update AGENTS.md so stack/dependency/credential decisions resolve through docs/STACK.md before Executor invents packages or env names. Update docs/ARCHITECTURE.md so its Target V1 application stack is concise and delegates the complete matrix to docs/STACK.md. Update docs/ENGINEERING_RULES.md with the credential-class boundary: PUBLIC_BROWSER may be exposed intentionally; SERVER_SECRET never enters NEXT_PUBLIC_*; OPERATOR_ONLY credentials must not be consumed by application runtime code."
    - "Preserve docs/PRODUCT.md and docs/STUDY.md product semantics. Cross-link docs/STACK.md only when needed for navigation; do not rewrite feature behavior merely to restate provider choices."
    - "This task is documentation/environment-contract only. Do not install/remove/update npm packages, mutate pnpm-lock.yaml/package.json/source code, connect/deploy Vercel, create/modify Supabase/Cloudinary/Google resources, generate actual API keys, fetch secrets into the repository, or implement any feature/provider integration."
    - "Verify inventory completeness mechanically: every process.env reference in tracked application source must have one matching .env.example entry and docs/STACK.md row; every .env.example variable must have exactly one docs/STACK.md owner/classification; every selected/deferred external capability must be represented once; every explicit V1 exclusion that is commonly mistaken as a key requirement must be represented as NO_KEY/NOT_REQUIRED/EXCLUDED as appropriate."
    - "Run pnpm install --frozen-lockfile, pnpm lint, pnpm typecheck and pnpm build on the exact candidate to prove documentation/env changes did not perturb the accepted scaffold. Prove package.json, pnpm-lock.yaml and src/ are byte-identical to the execution base."
    - "Commit the coherent candidate on main, author .agent/tasks/TASK-0002/report.yaml as its sole report-only child, publish by ordinary non-force fast-forward to main, prove fresh remote closure, and stop at NEEDS_REVIEW. Do not self-review or create TASK-0003."
