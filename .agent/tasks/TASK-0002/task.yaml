invariants:
  - "MAIN_ONLY remains exact; no branch/worktree branch/tag/release creation."
  - "TASK-0001 accepted implementation bytes remain untouched: package.json, pnpm-lock.yaml, pnpm-workspace.yaml, eslint.config.mjs, tsconfig.json, next-env.d.ts and src/ are immutable in TASK-0002."
  - "Completeness means every V1-selected/deferred/excluded framework/provider has an explicit status and every credential-bearing integration has an explicit canonical variable/acquisition contract; it does not mean installing every deferred dependency or storing every possible vendor credential."
  - "No real credential value is committed. .env.example is an inventory/template only."
  - "NEXT_PUBLIC_* is reserved only for intentionally browser-exposed values. SERVER_SECRET and OPERATOR_ONLY credentials never receive NEXT_PUBLIC_* names."
  - "Operator-only credentials are not application runtime dependencies. Their listing in .env.example/docs is inventory, not authorization for app code to read them."
  - "Core Study/Practice runtime remains zero-paid-API; OpenAI runtime/API keys remain excluded."
  - "Cloudinary and YouTube Data API remain feature-gated/deferred; documenting credentials does not activate those services or authorize media copying."
  - "Vercel Git auto-deploy remains unactivated; documenting Vercel operator credentials does not authorize deployment."
  - "Hugging Face public Whisper model access is NO_KEY for V1 and must not introduce HF_TOKEN."
  - "ChatGPT/Supabase connected operational tooling may authenticate with OAuth/plugin connection and is not forced to use a repo-stored PAT."

forbidden_changes:
  - "Create any branch, worktree branch, tag, release, PR-only topology or alternate integration ref."
  - "Modify package.json, pnpm-lock.yaml, pnpm-workspace.yaml, eslint.config.mjs, tsconfig.json, next-env.d.ts or anything under src/."
  - "Install, update, remove or execute initialization for shadcn/ui, Tailwind, react-markdown, remark-gfm, @huggingface/transformers, Cloudinary SDK, Google/YouTube SDK, Vercel SDK/CLI, Supabase CLI or any other dependency as part of repository mutation."
  - "Create/provider-link/deploy Vercel or enable Git auto-deploy."
  - "Create or mutate Supabase, Cloudinary or Google Cloud resources; generate/rotate/revoke/fetch actual keys or secrets."
  - "Commit any actual secret/token/password/key value, .env.local, .env.operator.local, Vercel .vercel metadata, provider credential JSON, or downloaded OAuth client secret."
  - "Add OPENAI_API_KEY, HF_TOKEN, Google OAuth client secret, analytics credentials, Redis credentials, vector/embedding credentials, or unrelated future-service env vars."
  - "Change product/Study semantics, data model, auth behavior, RLS, deployment/release behavior or feature implementation."
  - "Turn a deferred provider into an active runtime dependency merely because its credential is documented."

