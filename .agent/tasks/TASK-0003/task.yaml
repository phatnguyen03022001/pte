acceptance_criteria:
  - id: AC-1
    requirement: "PTE has one canonical migration-backed neutral taxonomy consisting only of skills, subskills and skill_subskills, with deterministic stable identifiers and exactly four seeded top-level communicative skills."
    evidence_required: "Exact migration artifact/live migration identity; live table/column/constraint/FK/row inventory; zero unauthorized public application tables and zero seeded subskills/mappings."
  - id: AC-2
    requirement: "The taxonomy is safely browser-readable but not browser-writable."
    evidence_required: "RLS-enabled proof for all three tables; grants/policy inventory; Data API GET proof with exact four skill rows plus empty subskills; rejected anonymous write proof followed by unchanged-row proof."
  - id: AC-3
    requirement: "Repository TypeScript has an exact generated Database contract for the live schema and the existing Supabase clients use it without changing auth/session semantics."
    evidence_required: "Generated-type provenance from exact project; source inspection/typecheck; no privileged env references or new data-access layer."
  - id: AC-4
    requirement: "The live Supabase project remains clean from a security/performance perspective after the bounded migration."
    evidence_required: "Fresh post-migration security/performance advisor output plus catalog proof; no unresolved TASK-0003-attributable security finding."
  - id: AC-5
    requirement: "The accepted application stack remains mechanically healthy with no dependency drift."
    evidence_required: "package.json/pnpm-lock/pnpm-workspace exact base identity; pnpm install --frozen-lockfile, lint, typecheck, build and git diff --check all PASS; no tracked real env/operator credentials."
  - id: AC-6
    requirement: "Candidate/report publication closes truthfully on canonical main for independent Architect review."
    evidence_required: "Candidate direct child of exact handoff base; report sole report-only child; ordinary non-force publication; fresh remote main equals report commit; main-only topology and clean local closure."

