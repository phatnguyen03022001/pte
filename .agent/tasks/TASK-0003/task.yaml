structure_authority:
  status: RESOLVED
  source: "docs/ARCHITECTURE.md and docs/STUDY.md"
  rationale: "Study and Practice both require stable neutral skill/subskill identifiers. Authorize one minimal shared database taxonomy foundation plus generated database typing; do not create Study, Practice or auth feature ownership."

objective: "Establish the first migration-backed Supabase data foundation for PTE by materializing a minimal neutral skill/subskill taxonomy with public read-only RLS, exact live-project alignment, and generated TypeScript database types, without implementing Study content, Practice behavior, learner auth/profile state, or any other product schema."

scope:
  required_changes:
    - "Fresh-resolve TASK-0003 revision 1, the bound TASK-0002 ACCEPTED review, canonical GitHub main, the designated local checkout /Users/tienphat/Developer/pte, and the exact Supabase target before mutation. A clean correctly bound local main may be ordinary FF-only synchronized to the TASK-0003 handoff base; preserve ignored .DS_Store and ignored real env files."
    - "Bind live database mutation only to Supabase project ref ayqcpsdebldtzohwdmer. Re-prove immediately before the first remote mutation that local NEXT_PUBLIC_SUPABASE_URL resolves to that exact ref, the connected project is ACTIVE_HEALTHY, public has zero application tables, migration history is empty, and security/performance advisors have no existing findings. Any project/ref mismatch or unexpected schema/migration drift is BLOCKED."
    - "Create one repository migration under supabase/migrations representing the exact live migration applied to ayqcpsdebldtzohwdmer. Use a current supported Supabase migration workflow or connected Supabase migration capability; do not invent a migration-history identity that does not correspond to the applied canonical migration. Do not add Supabase CLI or another package to package.json solely for migration ceremony."
    - "The migration must create exactly three shared public taxonomy tables: skills, subskills, and skill_subskills. Use stable lowercase snake_case text codes as semantic identifiers rather than UUIDs or database enums."
    - "skills owns code text primary key, label text not null, and sort_order smallint not null with a non-negative check. Seed exactly the four already-authorized communicative skills in deterministic order: listening, speaking, reading, writing. Labels are Listening, Speaking, Reading, Writing. Do not seed task types or speculative taxonomies."
    - "subskills owns code text primary key, label text not null, and nullable description text. Do not seed subskills in this task; future Study/Practice tasks own concrete subskill vocabulary."
    - "skill_subskills owns skill_code and subskill_code foreign keys to the two taxonomy owners and a composite primary key. Use restrictive deletion semantics so referenced taxonomy cannot disappear implicitly. Do not encode many-to-many relationships in arrays or comma-separated fields."
    - "Apply a simple lowercase snake_case code-format check to skills.code and subskills.code so shared identifiers remain stable/reconstructible. Do not add generic taxonomy registries, JSON metadata bags, versioning tables, triggers, audit tables, soft-delete machinery or speculative hierarchy."
    - "Enable RLS on all three public tables. Explicitly remove write privileges from anon and authenticated. Grant SELECT only to anon and authenticated and create SELECT policies for those roles. No browser-facing INSERT/UPDATE/DELETE policy is authorized. Privileged operational/database-owner tooling may mutate taxonomy outside learner browser credentials."
    - "Do not create profiles, learner tables, auth triggers, user-owned state, Study content tables, study_content_subskills, attempts/results, media/provenance tables, storage buckets, functions, views, realtime publications, Edge Functions, cron, queues or any other schema."
    - "After the live migration succeeds, generate TypeScript database types from the exact bound project and persist the generated database contract under src/types/database.ts or the smallest equivalent neutral shared type owner consistent with current source structure. Wire the existing Supabase browser/server client factories to the generated Database generic without changing authentication/session behavior."
    - "Do not add, remove or update npm dependencies. Preserve package.json, pnpm-lock.yaml, pnpm-workspace.yaml and the existing locked package versions exactly."
    - "Prove live schema shape after migration: exactly the three authorized public application tables, expected columns/primary keys/foreign keys/check constraints, RLS enabled on all three, exact four skills rows and zero subskills/skill_subskills rows."
    - "Prove privilege/RLS behavior through both catalog inspection and the real Data API using the existing local publishable key: anonymous/public GET of skills succeeds and returns exactly the four ordered seeded rows; GET of empty subskills succeeds; an anonymous/public write attempt is rejected and leaves data unchanged. Never print or persist the key."
    - "Run fresh Supabase security and performance advisors after the migration. No new security finding attributable to TASK-0003 is acceptable. Any performance finding attributable to the three-table foundation must be resolved only if it is local, necessary and inside this exact schema boundary; otherwise stop/report truthfully."
    - "Verify generated database types correspond to the live schema and the existing Supabase client files use Database typing without introducing privileged credentials, auth product behavior or another data-access abstraction."
    - "Run pnpm install --frozen-lockfile, pnpm lint, pnpm typecheck and pnpm build on the exact candidate. Also run git diff --check and prove no real env/operator credential file is tracked."
    - "Commit one coherent implementation candidate on main, create .agent/tasks/TASK-0003/report.yaml as its sole report-only child, publish by ordinary non-force fast-forward to canonical main, fresh-resolve GitHub closure, and stop at NEEDS_REVIEW. Do not self-review, deploy Vercel, or create TASK-0004."

