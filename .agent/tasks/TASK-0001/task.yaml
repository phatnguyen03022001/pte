structure_authority:
  status: RESOLVED
  source: "docs/ARCHITECTURE.md, docs/STUDY.md and empty-implementation bootstrap state"
  rationale: "The repository has product/architecture/spec truth but no implementation structure yet. Authorize only the minimum root/app/Supabase integration scaffold needed to establish repo-native conventions; Study and other feature topology remain semantic rather than pre-created folder ceremony."

objective: "Bootstrap a minimal production-ready PTE web application scaffold on canonical main using Next.js App Router, React, TypeScript, pnpm and a narrow Supabase client/server integration seam, with deterministic repository-native checks and no product-feature implementation."

scope:
  required_changes:
    - "Fresh-resolve the exact revision-2 task and handoff snapshot on phatnguyen03022001/pte main. Revision 2 supersedes unexecuted revision 1. Require live remote main and the execution checkout to match the authorized base before mutation. Do not create any branch, worktree branch, tag, release or alternate integration ref."
    - "Initialize the application at repository root with the current stable Next.js App Router + React + TypeScript package set compatible with the current official Next.js/Vercel guidance at execution time. Use pnpm and commit one exact lockfile. Preserve all existing planning/authority documents including docs/STUDY.md."
    - "Use a source layout that keeps Next.js routing under src/app and leaves feature/domain ownership available for later task-specific implementation. Do not create placeholder Study, Practice or skill-feature directories/files solely to predeclare a tree."
    - "Enable strict TypeScript and repo-native lint/typecheck/build commands. Keep the toolchain minimal; do not add a test framework merely to satisfy generic ECC coverage/TDD guidance because TASK-0001 adds no product behavior."
    - "Add only the minimal Supabase application dependencies needed for supported Next.js browser/server clients, using current official Supabase guidance. Establish a small shared Supabase integration seam and an .env.example contract for public URL/publishable credentials. Never add, require or expose a service-role/secret key in browser code."
    - "Create a minimal landing route sufficient to prove the application boots and renders. It must not implement Study/Coach, auth, practice, question types, scoring, recording/STT, progress, mock tests, recommendations, ingestion or admin behavior."
    - "Do not create Supabase domain tables, Study tables/mappings, learner-progress tables, media tables, migrations, RLS policies, storage buckets or live project mutations in this task. Database/auth/Study product work is a separate feature boundary."
    - "Do not add Cloudinary, OpenAI/runtime AI, Markdown/CMS packages for future Study UI, YouTube/media integration, analytics, Redis, queues, background workers, crawlers, vector/embedding infrastructure, microservices, generic repository/data-access abstractions, state libraries or other speculative dependencies."
    - "After implementation, verify the exact candidate with pnpm install --frozen-lockfile, lint, typecheck and production build using the actual repo-native scripts. Also prove the minimal application route can serve successfully using a bounded local start/request check or an equivalent target-native build/runtime proof."
    - "Commit the qualified candidate on main, create the canonical TASK-0001 report as the sole report-only child, and publish by ordinary non-force fast-forward to main. Re-resolve fresh remote main after publication. Stop at NEEDS_REVIEW; do not self-review or start TASK-0002."
  allowed_existing_files_or_components:
    - "repository-root application/tooling files required by the authorized scaffold"
    - "src/app"
    - "narrow shared Supabase browser/server integration"
    - ".env.example"
    - "existing README.md, AGENTS.md and docs/ planning/product/spec truth"
    - ".agent/tasks/TASK-0001/report.yaml"

invariants:
  - "MAIN_ONLY remains exact: only main is used; create_branch=false is non-waivable for this task."
  - "Existing PTE product/architecture/rule/Study documents remain authoritative and are not weakened or reinterpreted by implementation convenience."
  - "Study is a first-class future product domain and Study ↔ subskill ↔ Practice is a durable product relationship, but TASK-0001 implements none of those feature semantics."
  - "Core Study/Practice runtime remains zero-paid-API by product authority; no runtime OpenAI dependency is introduced."
  - "No product feature semantics, database domain schema, content ingestion, media persistence, learner progress, recommendation engine or crawler are introduced by the scaffold."
  - "No learner audio persistence, paid API, Cloudinary dependency, custom admin/CMS UI, service-role browser credential or database schema is introduced."
  - "ECC remains exact-pinned HOW only. No ECC hook/orchestrator/role/session/global configuration or installer is activated."
  - "New dependency count stays minimal and attributable to the authorized Next.js/React/TypeScript toolchain, lint/build tooling, pnpm lockfile and narrow Supabase Next.js integration."

forbidden_changes:
  - "Create or publish any branch other than main, including temporary/recovery/feature/staging branches."
  - "Force push, rewrite canonical history, create tags/releases, or change repository topology."
  - "Implement Study/Coach UI/content/schema/recommendations, auth/product tables/RLS/domain schema, practice flows, PTE question types, scoring, audio/STT, progress, mock-test, admin/CMS, analytics, crawler/ingestion, YouTube/media persistence or paid external integrations."
  - "Add speculative infrastructure or architecture layers not required by this scaffold."
  - "Adopt generic ECC examples such as Repository Pattern, blanket 80% coverage, mandatory TDD, Zod, or rate-limiting as dependencies/acceptance merely because upstream mentions them."
  - "Modify PTE product invariants, Study/Practice ownership, rights/provenance policy, architecture ownership, external-service boundaries or engineering-rule adoption without revised Architect authority."

