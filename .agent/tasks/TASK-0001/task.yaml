acceptance_criteria:
  - id: AC-1
    requirement: "The repository has one minimal locked Next.js App Router + React + TypeScript + pnpm scaffold that preserves all current planning/product/spec authority and MAIN_ONLY topology."
    evidence_required: "Exact dependency/lockfile inventory; strict TypeScript/tooling config; fresh branch/ref proof showing main only; README/AGENTS/docs including docs/STUDY.md preserved; no branch creation."
  - id: AC-2
    requirement: "The scaffold has a narrow current-supported Supabase Next.js integration seam without creating product data/schema or exposing privileged credentials."
    evidence_required: "Inspect browser/server integration and .env.example; dependency provenance; proof that no service-role/secret credential is present or required client-side; no migrations/domain/Study/media tables/RLS/storage changes."
  - id: AC-3
    requirement: "The scaffold is mechanically healthy and the minimal app is runnable."
    evidence_required: "pnpm install --frozen-lockfile PASS, lint PASS, typecheck PASS, production build PASS, plus bounded local HTTP/runtime proof for the minimal route or an equivalent deterministic target-native runtime check."
  - id: AC-4
    requirement: "TASK-0001 remains infrastructure-only and does not manufacture Study, Practice or other product scope or speculative architecture."
    evidence_required: "Base-to-candidate diff review proving no Study/auth/practice/question/scoring/audio/progress/mock/admin implementation, no content/media ingestion, no OpenAI/Cloudinary/YouTube/Redis/queue/crawler/vector/microservice/generic repository layer, and no unauthorized dependencies."
  - id: AC-5
    requirement: "Candidate/report publication closes truthfully on canonical main for independent Architect review."
    evidence_required: "Candidate is descended from the exact handoff base; report is its sole report-only child; ordinary non-force fast-forward publication succeeds; fresh remote main equals the report commit; final result is NEEDS_REVIEW."

