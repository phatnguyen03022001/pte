    - "Use these exact semantic contracts:
      1) campus-study-spaces — title 'Campus study spaces' — starter. A argues for more quiet individual spaces because the library fills near exams; B prefers bookable group rooms because collaborative assignments are increasing; C proposes zoning floors by noise/activity. Second turns: A supports zoning if silent capacity is protected; B agrees and asks for simple booking limits; C concludes a mixed zoning/booking model could serve both needs. Review points: common topic is redesigning campus study space; A prioritizes quiet individual capacity; B prioritizes bookable collaboration rooms; C proposes noise/activity zoning; final relationship is qualified agreement around a mixed model.
      2) group-project-deadlines — title 'Managing group project deadlines' — starter. A says one final deadline causes late coordination; B prefers staged milestones; C worries too many checkpoints create administration. Second turns: A supports two major checkpoints; B says peer progress notes could keep accountability light; C accepts a small number of milestones if requirements stay simple. Review points: topic is managing group-project deadlines; A identifies late coordination risk; B supports staged milestones/accountability; C raises administrative burden; group converges on a small number of simple checkpoints.
      3) online-and-campus-tutorials — title 'Online and campus tutorials' — starter. A values recorded online tutorials for flexible review; B says in-person sessions make questions/discussion easier; C suggests alternating formats. Second turns: A accepts campus sessions for difficult topics; B supports recordings as follow-up; C concludes a blended schedule combines flexibility and interaction. Review points: topic is tutorial format; A emphasizes flexible recorded access; B emphasizes live interaction; C proposes alternating/blended delivery; consensus moves toward a blended model.
      4) urban-cycling-policy — title 'Urban cycling policy' — developing. A argues protected lanes improve safety and encourage new riders; B says road-space changes can disrupt buses/deliveries; C proposes corridor-specific redesign using traffic data. Second turns: A accepts phased pilots; B supports pilots with bus/trade monitoring; C concludes evidence from pilots should guide permanent changes. Review points: topic is urban cycling policy; A prioritizes safety/protected lanes; B highlights transport/delivery trade-offs; C proposes data-led corridor pilots; final relationship is conditional agreement on monitored pilots.
      5) reproducible-data-practice — title 'Reproducible data practice' — developing. A says research teams should document code/data transformations; B argues documentation takes time but reduces later confusion; C recommends lightweight shared templates/versioned scripts. Second turns: A says templates would reduce burden; B agrees if requirements scale with project complexity; C concludes standard minimal documentation plus versioning improves reproducibility without excessive overhead. Review points: topic is reproducible research workflow; A wants documented transformations; B balances cost against reduced confusion; C proposes lightweight templates/versioning; group converges on minimal scalable documentation.
      6) renewable-energy-storage — title 'Renewable energy storage' — developing. A argues batteries help balance short-term solar/wind variability; B notes long-duration shortages need other options; C suggests combining storage technologies with demand response/grid links. Second turns: A agrees batteries are only one layer; B supports diversified planning instead of one technology; C concludes system reliability depends on a portfolio. Review points: topic is renewable-energy storage/reliability; A emphasizes batteries for short-term balancing; B identifies long-duration limitations; C proposes a portfolio including storage/demand/grid links; group agrees no single technology solves every timescale."
