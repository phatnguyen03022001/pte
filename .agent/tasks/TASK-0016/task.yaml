    - "Persist these exact scenario contracts and wording:
      1) deadline-extension — title 'Requesting a deadline extension' — starter — situation_text 'You are speaking to your professor. A required data file was unavailable for two days, so you could not finish your report on time. The report is due Wednesday. Ask for a two-day extension until Friday, explain the reason briefly, and show that you will use the extra time responsibly.' — review points: address the professor appropriately; explain the unavailable data file; state the Wednesday deadline; clearly request extension until Friday; close responsibly/politely.
      2) reschedule-project-meeting — title 'Rescheduling a project meeting' — starter — situation_text 'You are speaking to your project partner. Your laboratory class has been moved to the same time as your Wednesday afternoon meeting. Ask to move the meeting to Thursday morning, explain the clash, and confirm that you still want enough time to prepare before the group deadline on Friday.' — review points: address partner naturally; explain lab clash; request Thursday morning; preserve Friday group deadline; keep cooperative tone.
      3) reserved-study-room — title 'Resolving a study-room booking problem' — starter — situation_text 'You are speaking to library staff. You booked a study room from 2 p.m., but another group is still using it after your booking has started. Politely explain that you have a valid reservation and ask the staff member to help you access the room or find an immediate alternative.' — review points: address library staff politely; state 2 p.m. reservation; explain current room conflict; request access or immediate alternative; keep calm practical tone.
      4) missing-lecture-slides — title 'Requesting missing lecture slides' — starter — situation_text 'You are speaking to your lecturer. The slides from Monday's lecture are not available on the course site, and you need them to review an important diagram before Friday's tutorial. Politely explain the problem and ask whether the slides can be uploaded before the tutorial.' — review points: address lecturer appropriately; identify Monday slides missing; mention important diagram; request upload before Friday tutorial; use concise polite tone.
      5) lab-booking-change — title 'Changing a laboratory booking' — developing — situation_text 'You are speaking to the laboratory coordinator. Your equipment booking for Thursday was cancelled because of maintenance, but your experiment must be completed before next Tuesday. Explain the scheduling problem, ask for the earliest suitable alternative slot, and make clear that you can adjust your other commitments if necessary.' — review points: address coordinator professionally; state Thursday cancellation/maintenance; preserve Tuesday completion constraint; ask earliest suitable slot; offer scheduling flexibility.
      6) group-draft-delay — title 'Following up on a delayed group draft' — developing — situation_text 'You are speaking to a teammate. The shared draft is due tomorrow, but their section has not been added yet and the group needs time to edit the full document. Be direct but professional: explain the impact, ask them to upload their section this evening, and request an update if there is a problem.' — review points: address teammate directly; state draft due tomorrow; explain editing impact; request upload this evening; ask for an update while staying professional.
      7) presentation-room-change — title 'Communicating a presentation room change' — developing — situation_text 'You are speaking to classmates before a presentation. The room listed in the timetable has been changed at short notice, and two group members have not seen the update. Explain the new room information, ask the classmates to contact the missing members, and confirm where everyone should meet before the presentation starts.' — review points: address classmates naturally; explain room change; mention two missing members; ask classmates to contact them; confirm meeting location/time before presentation.
      8) club-event-accessibility — title 'Improving accessibility for a club event' — developing — situation_text 'You are speaking to a student club committee. The event budget is almost fixed, but the current plan does not include live captions for an invited speaker. Persuade the committee to move some printing money to captioning, explain why accessibility matters, and suggest using digital handouts to reduce printing costs.' — review points: address committee persuasively; identify missing live captions; request budget shift from printing; explain accessibility reason; suggest digital handouts as practical trade-off."
