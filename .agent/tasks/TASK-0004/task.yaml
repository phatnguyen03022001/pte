acceptance_criteria:
  - id: AC-1
    requirement: "The live/repository migration materializes exactly the authorized Study content owner and Study-to-subskill mapping with the required constraints and no unrelated schema."
    evidence_required: "Migration identity/byte evidence; live table/column/check/PK/FK/index inventory; exact pre-existing taxonomy preserved; Study tables empty after rollback proofs."
  - id: AC-2
    requirement: "Public/browser access is active-content read-only and inactive content is not publicly visible."
    evidence_required: "RLS/grant/policy catalog plus rollback-scoped active-vs-inactive anon visibility proof; no browser write grants/policies; post-proof empty Data API GET confirmation."
  - id: AC-3
    requirement: "Connected privileged operational tooling can create, revise and deactivate Study content without persistent smoke data or browser secrets."
    evidence_required: "Single rollback-scoped authoring lifecycle transcript/evidence showing create -> revise -> deactivate -> rollback; post-rollback zero Study rows; no learner/runtime secret path."
  - id: AC-4
    requirement: "Generated repository Database typing exactly matches the live schema and accepted Supabase client behavior remains intact."
    evidence_required: "Fresh exact-project generated-type byte match; typecheck/source inspection; no new data-access abstraction or auth/session behavior."
  - id: AC-5
    requirement: "Live database and application remain mechanically/security healthy with no dependency drift."
    evidence_required: "Fresh Security/Performance Advisor outputs; package/lock/workspace base identity; frozen install/lint/typecheck/build/diff-check PASS; secret/tracked-env hygiene."
  - id: AC-6
    requirement: "Candidate/report publication closes truthfully on canonical main for independent Architect review."
    evidence_required: "Candidate direct child of exact handoff base; report sole report-only child; non-force publication; fresh remote main equals report commit; main-only topology and clean local closure."

