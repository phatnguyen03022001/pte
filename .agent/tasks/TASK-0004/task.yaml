  - "Mutate another Supabase project or proceed on unexpected live-schema/migration drift."
  - "Create/seed concrete subskills or persistent Study content."
  - "Create learner progress/bookmarks/completion, Practice, attempts/results, weakness evidence, media/provenance asset tables, auth/profile state, storage, views, functions, triggers, Realtime, Edge Functions, cron, queues or background workers."
  - "Use SECURITY DEFINER, custom roles, database enums, JSON metadata bags, version-history tables, generic repositories or ranking infrastructure."
  - "Grant anon/authenticated browser writes or expose privileged Supabase credentials."
  - "Install deferred frontend/content dependencies or modify package/lockfile versions."
  - "Modify Product/Study semantics, stack inventory or deployment state."

