structure_authority:
  status: RESOLVED
  source: "docs/STUDY.md conceptual data model plus accepted TASK-0003 shared taxonomy"
  rationale: "Study owns curated learning content; shared taxonomy already owns skills/subskills. Authorize only the Study content owner and its many-to-many subskill mapping, with no Practice or learner-progress ownership."

objective: "Materialize the minimal Study content database foundation and prove the operator/ChatGPT authoring lifecycle while preserving public active-content read-only access, shared taxonomy ownership, provenance fields, generated database typing and zero runtime AI dependency."

scope:
  required_changes:
    - "Fresh-resolve TASK-0004 revision 1, the bound TASK-0003 ACCEPTED review, canonical GitHub main, clean designated local checkout, and exact Supabase project ayqcpsdebldtzohwdmer before mutation. A clean correctly bound local main may be ordinary FF-only synchronized to the handoff base."
    - "Immediately before live mutation, prove project ayqcpsdebldtzohwdmer is ACTIVE_HEALTHY and still has exactly the accepted TASK-0003 public tables skills, subskills, skill_subskills; exact four skills rows; zero subskills/mappings; exactly migration 20261004202511_create_shared_taxonomy plus no unexpected later migration; zero Security Advisor findings. Unexpected drift is BLOCKED."
    - "Create exactly one new canonical repository/live migration for the Study content foundation. Repository migration bytes must represent the exact applied live migration."
    - "Create public.study_content with: id bigint generated always as identity primary key; slug text unique not null; type text not null; skill_code text nullable FK to public.skills(code) with ON UPDATE/DELETE RESTRICT; task_type text nullable; title text not null; body_markdown text not null; difficulty text nullable; target_score smallint nullable; source_type text not null; source_ref text nullable; created_by text not null; updated_by text not null; created_at timestamptz not null default now(); updated_at timestamptz not null default now(); active boolean not null default true."
    - "Use simple checks only: slug is lowercase kebab-case; type is one of strategy, template, skill_guide, common_mistake, playbook, plan; task_type/difficulty/source_type when present use lowercase snake_case; title/body_markdown/created_by/updated_by/source_type are non-empty after trim; target_score when present is between 10 and 90. Use text+CHECK, not a database enum."
    - "Create public.study_content_subskills with study_content_id bigint and subskill_code text, composite primary key, FK to study_content(id) and subskills(code), both ON UPDATE/DELETE RESTRICT. Add the smallest reverse subskill_code index needed by the later deterministic recommendation query. Do not add generic ranking/version/history tables."
    - "Enable RLS on both Study tables. Revoke all anon/authenticated table privileges then grant SELECT only. On study_content, anon/authenticated SELECT policy must expose only active=true rows. On study_content_subskills, anon/authenticated SELECT policy must expose a mapping only when its referenced Study item is active. No browser INSERT/UPDATE/DELETE policy or write grant is authorized."
    - "Do not seed persistent Study content or subskills in this task. Content quality/editorial seeding belongs to the next content/UI slice; schema proof must not leave smoke rows."
    - "Prove the privileged connected Supabase authoring path without persistent test data: in one transaction, create a valid temporary Study item, observe it, revise at least body_markdown/updated_by/updated_at, deactivate it, prove state transitions, then ROLLBACK. After rollback, prove study_content and study_content_subskills remain empty. This is operational tooling proof, not learner-browser authority."
    - "Prove RLS visibility without persistent fixtures using a rollback-scoped transaction or equivalent safe proof: create one active and one inactive temporary Study item as owner, switch to anon role/read context, prove only the active row is visible and no write is authorized, then rollback. Do not weaken RLS to make the proof convenient."
    - "Use the real Data API with the existing local publishable key for read-only confirmation that study_content and study_content_subskills are accessible and empty after rollback. Never print or persist the key."
    - "Generate TypeScript database types fresh from exact project ayqcpsdebldtzohwdmer and update src/types/database.ts to byte-match live generation. Existing Supabase clients remain typed with Database; no new repository/data-access abstraction is authorized."
    - "Run fresh Supabase Security and Performance Advisors after migration and proofs. Zero TASK-0004-attributable security finding is acceptable. Performance INFO for a newly necessary empty-table reverse-FK index may be retained with explicit rationale; do not generate artificial persistent usage merely to silence INFO."
    - "Do not add/remove/update npm dependencies. Preserve package.json, pnpm-lock.yaml and pnpm-workspace.yaml byte-identical to the execution base. Do not install react-markdown/shadcn or implement Study UI in this task."
    - "Run pnpm install --frozen-lockfile, pnpm lint, pnpm typecheck, pnpm build and git diff --check on the exact candidate. Prove no real env/operator credential is tracked and no privileged Supabase credential reference is introduced under src."
    - "Commit one coherent candidate on main, create .agent/tasks/TASK-0004/report.yaml as its sole report-only child, publish by ordinary non-force fast-forward to canonical main, fresh-resolve remote closure, and stop at NEEDS_REVIEW. Do not self-review, deploy Vercel, or create TASK-0005."

  allowed_existing_files_or_components:
    - "supabase/migrations"
    - "src/types/database.ts"
    - "src/lib/supabase/client.ts and src/lib/supabase/server.ts only if fresh generated typing requires a local compile repair; auth/session semantics must not change"
    - "package.json/pnpm-lock.yaml/pnpm-workspace.yaml only for byte-identity proof; mutation forbidden"
    - ".agent/tasks/TASK-0004/report.yaml"

