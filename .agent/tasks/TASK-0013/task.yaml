    - "Run bounded production HTTP proof: /practice exposes eight task types; /practice/retell-lecture default/selected/invalid routes return 200; initial HTML must not disclose lecture_text or review points; /study/retell-lecture-strategy returns 200 and links to Practice."
    - "Run real Chrome/CDP proof without adding browser-test dependencies. Use the actual practice SpeechSynthesis path for one lecture and generate one ignored task-owned fake-microphone response fixture from an original summary of that same lecture."
    - "Browser proof must demonstrate: lecture text absent before playback/result; exactly one Play lecture; local STT reaches WebGPU or documented WebGPU failure + WASM fallback; browser speech plays the exact DB lecture; replay is blocked; after playback the preparation timer starts 10 and decrements; recording stays blocked until prep completes and STT is ready; one response stops explicitly in <40 seconds; local transcript is non-empty; lecture text and exactly four review points are revealed only after result; selecting exactly three boxes displays Self-review key-point coverage: 3 / 4; disclaimer rejects official scoring; Reset restores playback/prep/record/result state; item change resets and loads next item."
