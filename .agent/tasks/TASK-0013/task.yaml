    - "Add exactly one Study strategy through privileged authoring: slug retell-lecture-strategy; type strategy; skill_code speaking; task_type retell_lecture; title 'Retell Lecture: notes to connected summary'; target_score 40; source_type project_authored; source_ref exact Pearson Speaking & Writing URL; created_by=updated_by=chatgpt_task_0013; active=true."
