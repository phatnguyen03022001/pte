    - "Use native browser SpeechSynthesis only for the lecture prompt. Because browser autoplay may require a user gesture, provide one explicit 'Play lecture' practice action per item/reset rather than pretending automatic playback. Explain that PTE plays the lecture automatically."
    - "Playback uses the exact lecture_text once per item/reset. Use an English voice when available, deterministic bounded rate near normal speech, and prevent replay until Reset/item change. Do not use remote TTS, audio files, Cloudinary or retained media."
    - "After speech synthesis ends, automatically begin an exact 10-second preparation countdown. Recording remains disabled during lecture playback and preparation. No practice skip for the 10-second preparation in this task."
    - "Local STT preparation may happen concurrently, but learner recording becomes available only when playback has ended, the 10-second preparation has completed, and local STT is ready."
    - "Permit exactly one learner response per item/reset through getUserMedia({audio:true}) + MediaRecorder/native audio APIs. Hard local response cap is 40 seconds. Provide explicit Stop response and auto-stop at 40."
    - "Learner audio remains ephemeral. Reuse src/lib/local-stt exact accepted primitives and exact @huggingface/transformers 4.3.0 + onnx-community/whisper-tiny.en@2575352d61be1bf7225cf8f8b268a4678025fc58, WebGPU preferred with one WASM fallback, mono Float32 16 kHz, no HF_TOKEN, no remote inference."
    - "After transcription, display the transcript, reveal the full project-authored lecture_text for comparison, and reveal exactly four review points."
    - "Provide four feature-local learner self-review checkboxes and display 'Self-review key-point coverage: K / 4' from learner-selected boxes only. This is self-assessment, not automatic semantic scoring."
    - "Explicitly state transcript/self-review are practice aids and not Pearson Content, Pronunciation, Oral Fluency, score or points; local STT errors may affect the transcript."
    - "Do not add automatic keyword/semantic/content scoring, pronunciation/fluency/pace scoring, memorized-template detection or an LLM."
