    - "After authoring, prove exactly eight active Retell Lecture rows, four starter/four developing, exact slugs/titles/provenance, each lecture 110..145 whitespace words and exactly four review points. Prove prior Study/Practice counts and deterministic fingerprints/hashes unchanged except the exact one new Study row."
